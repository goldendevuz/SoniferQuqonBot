services:
  bot:
    build:
      context: .
    container_name: 'SoniferQuqonBot'
    env_file:
      - .env
    networks:
      - app_net
    ports:
      - "4040:4040"
      - "5000:5000"
    volumes:
      - ./:/bot   # full project mount
    restart: always
    depends_on:
      - redis
      - django

  django:
    build:
      context: .
    container_name: django_app
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    working_dir: /bot/sonifer
    env_file:
      - .env
    volumes:
      - ./:/bot
    ports:
      - "8000:8000"
    networks:
      - app_net
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app_net

volumes:
  redis_data:

networks:
  app_net:
